name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Pack (dry)
        # `--ignore-scripts`: `prepack` runs `pnpm run build`, and npm writes that
        # script's banner onto the same stdout as the `--json` document: pack.json then
        # starts with "> dsh-image-forge@0.1.0 prepack" and is not JSON. The Build step
        # above already produced `lib/`, so the pack contents are the built ones anyway.
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e "const p=require('./pack.json'); const e=p[0]; console.log('files', e.files.length, 'size', e.size, 'unpacked', e.unpackedSize); if (e.files.some(f=>/\.pyc$|__pycache__/.test(f.path))) { console.error('bytecode leaked'); process.exit(1) }"
