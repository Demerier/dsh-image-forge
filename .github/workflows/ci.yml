name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    # Only meaningful for PRs: it diffs the dependency manifest between the base
    # and head commit and fails when the PR pulls in a vulnerable dependency.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v5
        with:
          # Block high and critical known vulnerabilities; lower severities are
          # reported in the check summary without failing the PR. No PR comment:
          # fork PRs only get a read-only token, so commenting there would fail
          # the job instead of just lacking a comment.
          fail-on-severity: high

  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Check lib/ is fresh
        # lib/ is committed on purpose: the `github:` install path loads it
        # without building (a git dependency install runs `prepare`, not
        # `prepack`, and `prepare` has no tsdown available). This step turns
        # "src changed but lib/ not rebuilt" into a red run here instead of a
        # silently stale artifact for GitHub users.
        run: git diff --exit-code lib/

      - name: Test
        run: pnpm test

      - name: Pack (dry)
        # `--ignore-scripts`: `prepack` runs `pnpm run build`, and npm writes that
        # script's banner onto the same stdout as the `--json` document: pack.json then
        # starts with "> dsh-image-forge@0.1.0 prepack" and is not JSON. The Build step
        # above already produced `lib/`, so the pack contents are the built ones anyway.
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e "const p=require('./pack.json'); const e=p[0]; console.log('files', e.files.length, 'size', e.size, 'unpacked', e.unpackedSize); if (e.files.some(f=>/\.pyc$|__pycache__/.test(f.path))) { console.error('bytecode leaked'); process.exit(1) }"
