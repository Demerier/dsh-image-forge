# Bundle patch for dsh-image-forge: the plugin rows this bundle inserts.
# Installed with `dsh plugin --profile <name> add <this directory>`, which adds
# the bundle layer to the profile; the row references the package by name so
# Node resolution finds the installed code.
- insert:
    - id: dsh-image-forge
      # name 必须是 Node 能解析到的模块名，即 package.json 的 name（npm 包名）。
      # 不能写成 'dsh-image-forge' 以外的注册名：src/index.ts 的 export const name
      # 是插件在 cordis context 里的注册名，loader 执行的是 import('<package name>')，
      # 两者不一致会 ERR_MODULE_NOT_FOUND。
      name: dsh-image-forge
